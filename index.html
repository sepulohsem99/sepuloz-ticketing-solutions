<!DOCTYPE html>
<html lang="ms" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sepuloz — Ticketing Solutions</title>
<meta name="description" content="Sistem pengurusan tiket untuk eMAS Portal, ITCS, IES dan IPS.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<!-- ===================================================== LOG MASUK -->
<div class="login" id="login">
  <header class="login-atas">
    <div class="jenama"><span class="jenama-titik"></span>Sepuloz</div>
    <button class="tb-ikon" id="btnTema" type="button" title="Tukar tema" aria-label="Tukar tema">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
      </svg>
    </button>
  </header>

  <div class="login-badan">
    <div class="login-kiri">
      <span class="lbl">Ticketing Solutions</span>
      <h1>Satu tempat.<em>Semua tiket.</em></h1>
      <p>Penguatkuasa lapor. Project Manager tetapkan severity dan agihkan. IT Support baiki. Setiap tindakan direkodkan — tiada tiket hilang dalam emel.</p>
      <div class="login-titik">
        <span>eMAS Portal</span>
        <span>ITCS</span>
        <span>IES</span>
        <span>IPS</span>
      </div>
    </div>

    <div class="peranan-kad">
      <span class="lbl">Masuk sebagai</span>
      <h2>Pilih peranan anda</h2>
      <div class="peranan-senarai" id="perananSenarai"></div>
    </div>
  </div>
</div>

<!-- ===================================================== APLIKASI -->
<div class="app" id="app">
  <header class="topbar">
    <div class="topbar-dalam">
      <div class="jenama"><span class="jenama-titik"></span>Sepuloz</div>
      <nav class="topbar-nav" id="navUtama"></nav>
      <div class="topbar-kanan">
        <button class="tb-ikon" id="btnTema2" type="button" title="Tukar tema" aria-label="Tukar tema">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
          </svg>
        </button>
        <div class="tb-pengguna">
          <span class="avatar" id="tbAvatar">SM</span>
          <span>
            <strong id="tbNama">—</strong>
            <small id="tbPeranan">—</small>
          </span>
        </div>
        <button class="tb-ikon" id="btnKeluar" type="button" title="Log keluar" aria-label="Log keluar">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="bekas" id="utama"></main>
</div>

<!-- ===================================================== LACI TIKET -->
<div class="laci-bg" id="laciBg"></div>
<aside class="laci" id="laci" aria-hidden="true"></aside>

<div id="modalAkar"></div>
<div id="toast" class="toast"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
